<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考研数学第二大脑 · 纠偏原型 v0.1</title>
<style>
  :root{
    --bg:#FAFAF7; --card:#FFF; --ink:#1E1E1C; --ink2:#5A5A56; --ink3:#8C8C86;
    --line:#E4E2DA; --line2:#CFCCC2; --soft:#F2F1EC;
    --teal:#0F6E56; --teal-bg:#E4F2EC; --amber:#8A5A0B; --amber-bg:#FAF0DC;
    --red:#A32D2D; --red-bg:#FBEAEA; --blue:#185FA5; --blue-bg:#E9F1FA; --gray-bg:#F2F1EC;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1080px; margin:0 auto; padding:28px 22px 60px}
  header{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; padding-bottom:18px; border-bottom:1px solid var(--line)}
  .ttl{font-size:20px; font-weight:600; letter-spacing:-.01em}
  .ttl .ver{font-size:11px; font-weight:400; color:var(--ink3); margin-left:10px; letter-spacing:.06em}
  .sub{font-size:13px; color:var(--ink2); margin-top:3px}
  .ctrl{display:flex; align-items:center; gap:10px}
  .seg{display:flex; background:var(--soft); border:1px solid var(--line); border-radius:9px; padding:3px}
  .seg button{border:0; background:transparent; padding:5px 14px; font-size:13px; border-radius:6px; cursor:pointer; color:var(--ink2); font-family:inherit}
  .seg button.on{background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .seed{font-size:11px; color:var(--amber); background:var(--amber-bg); border:1px solid #E8D3B8; border-radius:99px; padding:3px 10px; white-space:nowrap}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:18px 0}
  .stat{background:var(--card); padding:13px 16px}
  .stat .k{font-size:11.5px; color:var(--ink3)}
  .stat .v{font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.3}
  .stat .v small{font-size:12px; font-weight:400; color:var(--ink3); margin-left:2px}
  .tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:20px}
  .tabs button{border:0; background:transparent; padding:9px 16px; font-size:13.5px; color:var(--ink3); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; font-family:inherit}
  .tabs button.on{color:var(--ink); border-bottom-color:var(--ink); font-weight:600}
  .split{display:grid; grid-template-columns:322px 1fr; gap:18px; align-items:start}
  .list{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .item{padding:11px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:10px; align-items:flex-start}
  .item:last-child{border-bottom:none}
  .item:hover{background:#FCFCFA}
  .item.on{background:var(--blue-bg)}
  .item .n{flex:1; min-width:0}
  .item .s{font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .item .m{font-size:11px; color:var(--ink3); margin-top:2px}
  .badge{font-size:11px; font-weight:600; padding:1px 7px; border-radius:99px; white-space:nowrap; font-variant-numeric:tabular-nums}
  .b-teal{background:var(--teal-bg); color:var(--teal)}
  .b-amber{background:var(--amber-bg); color:var(--amber)}
  .b-red{background:var(--red-bg); color:var(--red)}
  .b-gray{background:var(--soft); color:var(--ink3)}
  .card{background:var(--card); border:1px solid var(--line2); border-radius:12px; overflow:hidden}
  .card .top{display:flex; justify-content:space-between; gap:16px; padding:18px 22px; background:#FCFCFA; border-bottom:1px solid var(--line)}
  .card .top .q b{display:block; font-size:15px; margin-bottom:4px; line-height:1.5}
  .card .top .q .meta{font-size:12px; color:var(--ink3)}
  .score{text-align:center; min-width:100px}
  .score .n{font-size:40px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
  .score .n.na{font-size:20px; padding-top:10px; color:var(--ink3)}
  .score .l{font-size:11px; color:var(--ink3); margin-top:6px}
  .dims{padding:16px 22px 6px}
  .dim{display:grid; grid-template-columns:76px 1fr 44px; gap:10px; align-items:center; font-size:12.5px; margin-bottom:10px; color:var(--ink2)}
  .track{height:6px; background:#F0EFE9; border-radius:99px; overflow:hidden}
  .track i{display:block; height:100%; border-radius:99px}
  .dim .v{text-align:right; font-variant-numeric:tabular-nums; font-size:12px}
  .verdict{padding:14px 22px; font-size:13px; line-height:1.75; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .verdict b{font-weight:600}
  .verdict .lead{display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:99px; margin-right:8px}
  .evid{padding:14px 22px 18px}
  .evid .h{font-size:11px; color:var(--ink3); letter-spacing:.05em; margin-bottom:8px}
  .evid .e{font-size:12.5px; color:var(--ink2); background:#F7F6F1; border-radius:6px; padding:7px 11px; margin-bottom:6px; display:flex; justify-content:space-between; gap:12px}
  .evid .e i{font-style:normal; color:var(--blue); white-space:nowrap}
  .note{padding:11px 22px 16px; font-size:12px; color:var(--ink3); border-top:1px dashed var(--line)}
  table{width:100%; border-collapse:collapse; font-size:13px; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line)}
  th{font-size:11.5px; color:var(--ink2); background:#F5F4EF; font-weight:600; white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#FCFCFA}
  .diag{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px}
  .panel h3{margin:0 0 12px; font-size:13px; font-weight:600}
  .big{font-size:34px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
  .big.red{color:var(--red)}
  .big em{font-style:normal; font-size:13px; color:var(--ink3); font-weight:400}
  .ch{margin-bottom:11px}
  .ch .r{display:flex; justify-content:space-between; font-size:12px; color:var(--ink2); margin-bottom:3px}
  .empty{padding:40px; text-align:center; color:var(--ink3); font-size:13px; background:var(--card); border:1px dashed var(--line2); border-radius:12px}
  .toast{font-size:12px; color:var(--blue); background:var(--blue-bg); border:1px solid #C9DCEF; border-radius:8px; padding:8px 12px; margin-bottom:14px}
  footer{margin-top:34px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink3); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
  @media (max-width:820px){
    .split,.diag{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr 1fr}
    .app{padding:20px 14px 40px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="ttl">考研数学第二大脑<span class="ver">纠偏原型 v0.1</span></div>
      <div class="sub">以 15 年真题的考法与思路为基准，判断这道题值不值得做</div>
    </div>
    <div class="ctrl">
      <div class="seg" id="seg">
        <button data-s="1">数一</button><button data-s="2">数二</button><button data-s="3">数三</button>
      </div>
      <span class="seed" title="仅用于验证判定链路，非经核对的真题库">SEED 示例语料</span>
    </div>
  </header>

  <div id="toast"></div>
  <div class="stats" id="stats"></div>
  <nav class="tabs" id="tabs">
    <button data-v="enter" class="on">录入确认</button>
    <button data-v="bank">题库体检</button>
    <button data-v="diag">诊断</button>
  </nav>
  <main id="view"></main>

  <footer>
    <span>考点树 110 叶子 · 真题语料 70 条 · 画像 35 个（考点 × 池）</span>
    <span>数据结构与判定逻辑为正式版骨架，语料待替换</span>
  </footer>
</div>

":"判断正项级数敛散性（含参比较判别）","source":"1000 题 P88-09","kp":"GS06-01-02","m":"概念辨析","f":"次族","d":4,"c":2,"mastery":0.4,"minutes":22,"date":"2026-11-03"},{"id":"Q12","stem":"计算第二类曲线积分，用格林公式","source":"习题册 P126-05","kp":"GS05-02-02","m":"直接计算","f":"主族","d":4,"c":4,"mastery":0.3,"minutes":26,"date":"2026-11-02"}],"meta":{"version":"0.1","built":"2026-11-06","seed":true}};</script>
<script>
const {kp, syllabus, exams, profile, questions} = DATA;
const KP = Object.fromEntries(kp.map(n => [n.id, n]));
const SUBJ = {1: "数一", 2: "数二", 3: "数三"};
const POOLNAME = {"GS_1": "数一高数池", "GS_2": "数二高数池", "GS_3": "数三高数池", "GS_ALL": "高数三卷合并池", "XD_ALL": "线代三卷合并池", "GL_13": "概率数一三合并池"};

const state = {subject: 1, view: "enter", sel: null, lastMsg: ""};

function poolOf(kpId, s) {
  const b = KP[kpId].block;
  if (b === "XD") return "XD_ALL";
  if (b === "GL") return "GL_13";
  return "GS_" + s;
}
function inScope(kpId, s) {
  const m = syllabus[kpId];
  return !!(m && m[s]);
}
function chapterOf(id) {
  let n = KP[id];
  while (n && n.level > 1) n = KP[n.parent];
  return n ? n.name : "—";
}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function judge(q, s) {
  const k = KP[q.kp];
  const base = {q, s, kp: k, pool: poolOf(q.kp, s), dims: null, evidence: [], lowSample: false};
  if (!inScope(q.kp, s)) {
    return {...base, score: 0, verdict: "超纲", reason: `「${k.name}」不在${SUBJ[s]}的考查范围内，大纲白名单直接否决。`};
  }
  const pOwn = profile[q.kp + "|" + base.pool];
  if (!pOwn) {
    return {...base, score: null, verdict: "数据不足", reason: `该考点在${POOLNAME[base.pool]}没有真题样本，无法判定。`};
  }
  // 本池样本不足时，考法与难度退回跨卷合并池借分布；热度必须用本卷事实
  let p = pOwn, usedPool = base.pool, lowSample = false;
  if (pOwn.n < 5) {
    const alt = profile[q.kp + "|GS_ALL"];
    if (alt && alt.n >= 5 && KP[q.kp].block === "GS") { p = alt; usedPool = "GS_ALL"; lowSample = true; }
  }
  if (p.n < 5) {
    return {...base, score: null, verdict: "数据不足", reason: `该考点在${POOLNAME[base.pool]}仅 ${pOwn.n} 条样本，退回合并池仍不足 5 条，不做判定。`};
  }
  const wcH = lowSample ? p.wc / 3 : pOwn.wc;  // 本池样本不足时，用合并池折算单卷频次
  const H = clamp(wcH / 15 * 100, 0, 100);
  const M = (p.method[q.m] || 0) * 100;
  const P = {"主族": 100, "次族": 60, "族外": 20}[q.f] ?? 20;
  let D = 100;
  if (q.d < p.dmin) D = clamp(100 - (p.dmin - q.d) * 40, 0, 100);
  if (q.d > p.dmax) D = clamp(100 - (q.d - p.dmax) * 40, 0, 100);
  const score = Math.round(0.3 * H + 0.3 * M + 0.25 * P + 0.15 * D);
  let verdict = "偏题";
  if (score >= 85) verdict = "真题同源";
  else if (score >= 65) verdict = "常规练习";
  else if (score >= 45) verdict = "轻微偏离";
  else if (score >= 25) verdict = "考法偏离";

  const methodList = Object.entries(p.method).sort((a, b) => b[1] - a[1]);
  const top = methodList[0] || ["—", 0];
  const ev = exams
    .filter(e => e.kp === q.kp && poolOf(e.kp, e.s) === base.pool)
    .sort((a, b) => b.y - a.y)
    .slice(0, 3);

  let reason = `「${k.name}」在${POOLNAME[usedPool]}出现 ${p.n} 次（时间衰减加权 ${p.wc}），最主流考法是「${top[0]}」（占 ${Math.round(top[1] * 100)}%）；本题考法为「${q.m}」（占 ${Math.round(M)}%）。`;
  if (q.f === "族外") reason += "本题的最优解法属族外（技巧性解法），不在该考点的真题标准思路族内。";
  if (lowSample) reason += ` 注意：${POOLNAME[base.pool]}仅 ${pOwn.n} 条样本，考法分布借用合并池，置信度已下调。`;

  return {...base, score, verdict, dims: {H, M, P, D}, evidence: ev, lowSample, usedPool, reason};
}

function tone(v) {
  if (v === "超纲" || v === "偏题") return "red";
  if (v === "考法偏离" || v === "轻微偏离") return "amber";
  if (v === "真题同源" || v === "常规练习") return "teal";
  return "gray";
}
const scoreColor = t => t === "red" ? "var(--red)" : t === "amber" ? "var(--amber)" : "var(--teal)";

function renderStats() {
  const s = state.subject;
  const js = questions.map(q => judge(q, s));
  const over = js.filter(x => x.verdict === "超纲").length;
  const scored = js.filter(x => x.score !== null && x.score > 0);
  const avg = scored.length ? Math.round(scored.reduce((a, b) => a + b.score, 0) / scored.length) : 0;
  const totalMin = questions.reduce((a, q) => a + q.minutes, 0);
  const offMin = js.filter(x => x.score === null || x.score < 45).reduce((a, x) => a + x.q.minutes, 0);
  const pct = totalMin ? Math.round(offMin / totalMin * 100) : 0;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="k">${SUBJ[s]} · 题库题量</div><div class="v">${questions.length}<small>题</small></div></div>
    <div class="stat"><div class="k">超纲（白名单否决）</div><div class="v" style="color:${over ? "var(--red)" : "var(--ink)"}">${over}<small>题</small></div></div>
    <div class="stat"><div class="k">平均贴合度</div><div class="v">${avg}<small>/100</small></div></div>
    <div class="stat"><div class="k">偏离题占用练习时间</div><div class="v" style="color:${pct > 25 ? "var(--red)" : "var(--ink)"}">${pct}<small>%</small></div></div>`;
}

function dimRow(label, val, hint) {
  const w = Math.round(clamp(val, 0, 100));
  const c = w >= 65 ? "var(--teal)" : w >= 40 ? "#C99A3E" : "#C2554A";
  return `<div class="dim"><span>${label}</span><span class="track"><i style="width:${w}%;background:${c}"></i></span><span class="v">${w}</span></div>`;
}

function detail(j) {
  const t = tone(j.verdict);
  const dims = j.dims;
  return `<div class="card">
    <div class="top">
      <div class="q">
        <b>${j.q.stem}</b>
        <div class="meta">${j.q.source} · 考点 ${j.kp.name} · ${chapterOf(j.q.kp)}</div>
      </div>
      <div class="score">
        <div class="n ${j.score === null ? "na" : ""}" style="color:${j.score === null ? "var(--ink3)" : scoreColor(t)}">${j.score === null ? "—" : j.score}</div>
        <div class="l">考研贴合度</div>
      </div>
    </div>
    ${dims ? `<div class="dims">
      ${dimRow("考点热度", dims.H)}
      ${dimRow("考法匹配", dims.M)}
      ${dimRow("思路匹配", dims.P)}
      ${dimRow("难度匹配", dims.D)}
    </div>` : ""}
    <div class="verdict">
      <span class="lead" style="background:var(--${t}-bg);color:var(--${t})">${j.verdict}</span>
      <b>${j.reason}</b>
    </div>
    ${j.evidence.length ? `<div class="evid">
      <div class="h">判定依据 · 最近 ${j.evidence.length} 条真题（同池同考点）</div>
      ${j.evidence.map(e => `<div class="e"><i>${e.y} ${SUBJ[e.s]} 第 ${e.no} 题</i><span>${e.stem} · ${e.m} · 难度 ${e.d}</span></div>`).join("")}
    </div>` : ""}
    <div class="note">当前科目 ${SUBJ[j.s]} · 画像池 ${POOLNAME[j.usedPool || j.pool]}${j.lowSample ? " · 样本不足，已借用合并池并降置信度" : ""}</div>
  </div>`;
}

function viewEnter() {
  const s = state.subject;
  const js = questions.map(q => judge(q, s)).sort((a, b) => (b.q.date || "").localeCompare(a.q.date || ""));
  if (!state.sel || !js.find(x => x.q.id === state.sel)) state.sel = js[0].q.id;
  const cur = js.find(x => x.q.id === state.sel);
  return `<div class="split">
    <div class="list">
      ${js.map(x => {
        const t = tone(x.verdict);
        return `<div class="item ${x.q.id === state.sel ? "on" : ""}" data-q="${x.q.id}">
          <div class="n"><div class="s">${x.q.stem}</div><div class="m">${x.q.source} · ${x.verdict}</div></div>
          <span class="badge b-${t}">${x.score === null ? "—" : x.score}</span>
        </div>`;
      }).join("")}
    </div>
    <div>${detail(cur)}</div>
  </div>`;
}

function viewBank() {
  const s = state.subject;
  const js = questions.map(q => judge(q, s)).sort((a, b) => (a.score ?? 999) - (b.score ?? 999));
  return `<div class="split" style="grid-template-columns:1fr 1fr">
    <table>
      <thead><tr><th>题干</th><th>考点</th><th>贴合度</th><th>判定</th></tr></thead>
      <tbody>
        ${js.map(x => `<tr data-q="${x.q.id}">
          <td style="max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.q.stem}</td>
          <td style="color:var(--ink2);font-size:12px">${x.kp.name}</td>
          <td><span class="badge b-${tone(x.verdict)}">${x.score === null ? "—" : x.score}</span></td>
          <td style="font-size:12px;color:var(--ink2)">${x.verdict}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    <div>${detail(js.find(x => x.q.id === state.sel) || js[0])}</div>
  </div>`;
}

function viewDiag() {
  const s = state.subject;
  const js = questions.map(q => judge(q, s));
  const total = questions.reduce((a, q) => a + q.minutes, 0);
  const offList = js.filter(x => x.score === null || x.score < 45);
  const offMin = offList.reduce((a, x) => a + x.q.minutes, 0);
  const pct = total ? Math.round(offMin / total * 100) : 0;

  const byCh = {};
  js.forEach(x => {
    const c = chapterOf(x.q.kp);
    (byCh[c] = byCh[c] || []).push(x.q.mastery);
  });
  const chs = Object.entries(byCh).map(([k, v]) => [k, Math.round(v.reduce((a, b) => a + b, 0) / v.length * 100)]).sort((a, b) => a[1] - b[1]);

  return `<div class="diag">
    <div class="panel">
      <h3>练习时间分配 · ${SUBJ[s]}</h3>
      <div class="big ${pct > 25 ? "red" : ""}">${pct}<em>%</em></div>
      <div style="font-size:12.5px;color:var(--ink2);margin-top:8px">本月 ${questions.length} 道题中 ${offList.length} 道偏离，占 ${offMin} / ${total} 分钟</div>
      <div style="margin-top:14px">
        ${offList.map(x => `<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)">
          <span style="color:var(--ink2)">${x.q.stem.length > 16 ? x.q.stem.slice(0, 16) + "…" : x.q.stem}</span>
          <span class="badge b-${tone(x.verdict)}">${x.score === null ? "—" : x.score}</span>
        </div>`).join("") || '<div style="font-size:12.5px;color:var(--ink3)">没有偏离题，时间分配健康</div>'}
      </div>
    </div>
    <div class="panel">
      <h3>章节掌握度（按题目熟练度均值）</h3>
      ${chs.map(([k, v]) => `<div class="ch">
        <div class="r"><span>${k}</span><span style="font-variant-numeric:tabular-nums">${v}%</span></div>
        <div class="track"><i style="width:${v}%;background:${v >= 65 ? "var(--teal)" : v >= 45 ? "#C99A3E" : "#C2554A"}"></i></div>
      </div>`).join("")}
      <div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink3)">
        切换科目后，白名单与画像池同时变化，同一道题的判定会重算——这是三卷大纲差异在数据层的直接体现。
      </div>
    </div>
  </div>`;
}

function render() {
  renderStats();
  const v = state.view;
  document.getElementById("view").innerHTML = v === "enter" ? viewEnter() : v === "bank" ? viewBank() : viewDiag();
  document.getElementById("toast").innerHTML = state.lastMsg ? `<div class="toast">${state.lastMsg}</div>` : "";
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", +b.dataset.s === state.subject));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === state.view));
  document.querySelectorAll("[data-q]").forEach(el => el.onclick = () => {
    state.sel = el.dataset.q;
    if (state.view === "diag") state.view = "enter";
    render();
  });
}

document.getElementById("seg").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const ns = +b.dataset.s;
  if (ns === state.subject) return;
  const before = questions.filter(q => !inScope(q.kp, state.subject)).length;
  state.subject = ns;
  const after = questions.filter(q => !inScope(q.kp, ns)).length;
  state.lastMsg = `已切换到${SUBJ[ns]}：白名单与画像池重算，超纲题 ${before} → ${after} 道`;
  render();
});

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  state.view = b.dataset.v;
  state.lastMsg = "";
  render();
});

render();
</script>
